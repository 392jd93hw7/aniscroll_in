services:
  - type: web
    name: aniscroll-animepahe-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: CORS_ORIGINS
        value: "*"
